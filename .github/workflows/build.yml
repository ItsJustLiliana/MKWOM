name: Build and test pre-beta
on:
  push:
    branches: [main, pre-beta]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[test-server]" pytest==8.4.2 ruff==0.14.14
      - run: python -m pytest -q
      - run: ruff check mkwom tools tests server
      - name: Validate legacy bootstrap shell syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/setup_arch_accounts_prebeta.sh scripts/setup_arch_lobby_prebeta.sh
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: sudo apt-get update && sudo apt-get install -y build-essential ninja-build cmake pkg-config
      - run: python3 tools/prepare_source.py build/source
      - uses: actions/cache@v6
        with:
          path: build/source/build/win
          key: win-${{ hashFiles('compatibility.json', 'patches/multiplayer.patch', 'patches/online-cheat-guard.patch') }}
          restore-keys: win-
      - name: Build and round-trip official runtime
        env:
          BUILD_VERSION: 0.1.0-${{ github.sha }}
        run: uv run --project build/source python tools/build_client.py --source build/source --version "$BUILD_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: client
          path: dist/mkwom-patch-windows-x64.zip
          if-no-files-found: error
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: python3 tools/prepare_source.py build/source
      - run: uv run --project build/source python build/source/tools/build/server.py --jobs 2
      - name: Real server protocol regressions
        run: MKW_SRV_EXE="$PWD/build/source/build/server/mkw-server" uv run --project build/source --group dev pytest build/source/tests/runtime/test_srv.py -n 0 -q
      - name: Package server
        env:
          BUILD_VERSION: 0.1.0-${{ github.sha }}
        run: python3 tools/server_release.py build/source "$BUILD_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: dist/mkwom-server-linux-x64.tar.gz
          if-no-files-found: error
  patcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pyinstaller==6.16.0
      - run: python -m PyInstaller --onefile --windowed --name mkwom --paths . tools/entry.py
      - run: ./dist/mkwom.exe --help
      - name: Check graphical Tkinter runtime is available
        run: python -c "import tkinter; import mkwom.gui; import mkwom.wizard; import mkwom.discovery"
      - uses: actions/upload-artifact@v7
        with:
          name: patcher
          path: dist/mkwom.exe
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request'
    needs: [tests, client, server, patcher]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Build metadata and checksums
        id: meta
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: python3 tools/release_metadata.py
      - name: Store tested pre-beta privately as Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: candidate-bundle
          path: dist/*
          retention-days: 90
          if-no-files-found: error

  queue-strato:
    name: Queue tested build on STRATO (no activation)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-24.04
    environment: pre-beta
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: candidate-bundle
          path: dist
      - name: Verify immutable staged build
        run: |
          set -euo pipefail
          cd dist
          grep '  mkwom-server-linux-x64.tar.gz$' SHA256SUMS | sha256sum --check --strict -
      - name: Configure pinned STRATO SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          mkdir -p "$RUNNER_TEMP/mkwom-ssh"
          chmod 700 "$RUNNER_TEMP/mkwom-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/mkwom-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/mkwom-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/mkwom-ssh/id_ed25519" "$RUNNER_TEMP/mkwom-ssh/known_hosts"
      - name: Store candidate in STRATO pending queue
        env:
          CANDIDATE: ${{ needs.publish.outputs.tag }}
          DEPLOY_SSH_KEY_PATH: ${{ runner.temp }}/mkwom-ssh/id_ed25519
          DEPLOY_SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/mkwom-ssh/known_hosts
        run: python3 tools/queue_strato.py
      - name: Record private proof of STRATO acceptance
        env:
          CANDIDATE: ${{ needs.publish.outputs.tag }}
        run: |
          printf '{"format":1,"target":"strato","candidate":"%s"}\\n' "$CANDIDATE" > dist/queued-strato.json
      - uses: actions/upload-artifact@v7
        with:
          name: strato-queue-receipt
          path: dist/queued-strato.json
          retention-days: 90
          if-no-files-found: error
  cleanup-old-prebeta:
    name: Remove obsolete public pre-beta releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [queue-strato]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Remove only legacy internal release entries after private candidate is safely queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/cleanup_prebeta_releases.py
