name: Deploy configured server
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      environment:
        type: string
        required: true
      restart_if_unchanged:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify manual stage deployment configuration
        env:
          AUTO_DEPLOY: ${{ vars.AUTO_DEPLOY }}
          NETWORK_ISOLATION_VERIFIED: ${{ vars.NETWORK_ISOLATION_VERIFIED }}
          DEPLOY_STAGE: ${{ inputs.environment }}
          DEPLOY_ROOT: ${{ inputs.environment == 'beta' && '/home/mkwom/projects/MKWOM-beta' || '/home/mkwom/projects/MKWOM-server' }}
          DEPLOY_UNIT: ${{ vars.DEPLOY_UNIT }}
          LISTEN_HOST: ${{ vars.LISTEN_HOST }}
          LOBBY_PORT: ${{ vars.LOBBY_PORT }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test "$AUTO_DEPLOY" = true || { echo "::error::Stage is not enabled. Set AUTO_DEPLOY=true only after initial host setup."; exit 1; }
          test "$NETWORK_ISOLATION_VERIFIED" = true || { echo "::error::Beta and Release must have verified independent UDP/STUN/NAT/TURN routing before promotion."; exit 1; }
          case "$DEPLOY_STAGE" in beta|release) ;; *) echo "::error::Live deploy must explicitly target beta or release"; exit 1 ;; esac
          for key in DEPLOY_ROOT DEPLOY_UNIT LISTEN_HOST LOBBY_PORT DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            test -n "${!key}" || { echo "::error::Missing required stage setting: $key"; exit 1; }
          done
      - name: Download verified server
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern mkwom-server-linux-x64.tar.gz --pattern SHA256SUMS --dir dist
          cd dist
          grep '  mkwom-server-linux-x64.tar.gz$' SHA256SUMS | sha256sum --check --strict -
          # Use reviewed deployment code from main for older immutable releases.
          cp ../tools/deploy_server.py ./deploy_server.py
          test -s ./deploy_server.py
      - name: Set up pinned-key SSH (STRATO only)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mkwom-ssh"
          chmod 700 "$RUNNER_TEMP/mkwom-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/mkwom-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/mkwom-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/mkwom-ssh/id_ed25519" "$RUNNER_TEMP/mkwom-ssh/known_hosts"
      - name: Check pinned host (no deployment)
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          test "$DEPLOY_HOST" = "31.70.192.231"
          test "$DEPLOY_USER" = "mkwom"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/mkwom-ssh/known_hosts" \
              -i "$RUNNER_TEMP/mkwom-ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" true
      - name: Deploy to STRATO over verified SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_STAGE: ${{ inputs.environment }}
          DEPLOY_ROOT: ${{ inputs.environment == 'beta' && '/home/mkwom/projects/MKWOM-beta' || '/home/mkwom/projects/MKWOM-server' }}
          DEPLOY_UNIT: ${{ vars.DEPLOY_UNIT }}
          LISTEN_HOST: ${{ vars.LISTEN_HOST }}
          LOBBY_PORT: ${{ vars.LOBBY_PORT }}
          DEPLOY_SSH_KEY_PATH: ${{ runner.temp }}/mkwom-ssh/id_ed25519
          DEPLOY_SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/mkwom-ssh/known_hosts
          RESTART_IF_UNCHANGED: ${{ inputs.restart_if_unchanged }}
        run: |
          python3 tools/remote_deploy.py
