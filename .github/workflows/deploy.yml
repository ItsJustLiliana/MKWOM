name: Deploy configured server
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      environment:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify manual stage deployment configuration
        env:
          AUTO_DEPLOY: ${{ vars.AUTO_DEPLOY }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_UNIT: ${{ vars.DEPLOY_UNIT }}
          LISTEN_HOST: ${{ vars.LISTEN_HOST }}
          LOBBY_PORT: ${{ vars.LOBBY_PORT }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          test "$AUTO_DEPLOY" = true || { echo "::error::Stage is not enabled. Set AUTO_DEPLOY=true only after initial host setup."; exit 1; }
          for key in DEPLOY_ROOT DEPLOY_UNIT LISTEN_HOST LOBBY_PORT DEPLOY_HOST DEPLOY_USER TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            test -n "${!key}" || { echo "::error::Missing required stage setting: $key"; exit 1; }
          done
      - name: Download verified server
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern mkwom-server-linux-x64.tar.gz --pattern SHA256SUMS --dir dist
          cd dist
          grep '  mkwom-server-linux-x64.tar.gz deploy logic from main, even for older candidate archives.
          cp ../tools/deploy_server.py ./deploy_server.py
          test -s ./deploy_server.py
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
      - name: Deploy over administrator tailnet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_UNIT: ${{ vars.DEPLOY_UNIT }}
          LISTEN_HOST: ${{ vars.LISTEN_HOST }}
          LOBBY_PORT: ${{ vars.LOBBY_PORT }}
        run: |
          python3 tools/remote_deploy.py
 SHA256SUMS | sha256sum --check --strict -
          # Use reviewed deploy logic from main, even for older candidate archives.
          cp ../tools/deploy_server.py ./deploy_server.py
          test -s ./deploy_server.py
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
      - name: Deploy over administrator tailnet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_UNIT: ${{ vars.DEPLOY_UNIT }}
          LISTEN_HOST: ${{ vars.LISTEN_HOST }}
          LOBBY_PORT: ${{ vars.LOBBY_PORT }}
        run: |
          python3 tools/remote_deploy.py
