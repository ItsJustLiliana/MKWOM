name: Activate pre-beta on STRATO (manual)
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Tested immutable pre-beta-<run>-<sha12> Release tag"
        required: true
permissions:
  contents: write
concurrency:
  group: approve-pre-beta
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE: ${{ inputs.candidate }}
        shell: bash
        run: |
          [[ "$CANDIDATE" =~ ^pre-beta-[0-9]+-[a-f0-9]{12}$ ]] || exit 1
          gh release view "$CANDIDATE" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == true' | grep -qx true
          echo "tag=$CANDIDATE" >> "$GITHUB_OUTPUT"
  deploy:
    needs: validate
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      environment: pre-beta
    secrets: inherit
  activate:
    needs: [validate, deploy]
    uses: ./.github/workflows/channel.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      channel: pre-beta
