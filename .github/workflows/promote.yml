name: Promote queued build to Beta or approved Beta to Release
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Optional; blank picks latest queued Beta candidate or current active Beta
        required: false
      destination:
        type: choice
        options: [beta, release]
        required: true
      release_version:
        description: Optional stable version; default uses the approved Beta's vX.Y.Z
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: promote-strato-live-server
  cancel-in-progress: false
jobs:
  release-preflight:
    if: inputs.destination == 'release'
    runs-on: ubuntu-24.04
    environment: pre-beta
    steps:
      - uses: actions/checkout@v7
      - name: Configure pinned STRATO SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          mkdir -p "$RUNNER_TEMP/mkwom-ssh"
          chmod 700 "$RUNNER_TEMP/mkwom-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/mkwom-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/mkwom-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/mkwom-ssh/id_ed25519" "$RUNNER_TEMP/mkwom-ssh/known_hosts"
      - name: Verify both score channels before creating stable Release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "31.70.192.231"
          test "$DEPLOY_USER" = "mkwom"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/mkwom-ssh/known_hosts" \
            -i "$RUNNER_TEMP/mkwom-ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "python3 -" < tools/check_release_readiness.py
  promote:
    if: always() && (inputs.destination == 'beta' || needs.release-preflight.result == 'success')
    needs: [release-preflight]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.destination }}
    outputs:
      tag: ${{ steps.promote.outputs.tag }}
      candidate: ${{ steps.promote.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
      - id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate }}
          DESTINATION: ${{ inputs.destination }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 tools/promote.py
  deploy-beta:
    if: always() && inputs.destination == 'beta' && needs.promote.result == 'success'
    needs: promote
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.promote.outputs.tag }}
      environment: pre-beta
    secrets: inherit
  activate-beta:
    if: always() && inputs.destination == 'beta' && needs.promote.result == 'success' && needs.deploy-beta.result == 'success'
    needs: [promote, deploy-beta]
    uses: ./.github/workflows/channel.yml
    with:
      tag: ${{ needs.promote.outputs.tag }}
      channel: beta
  cleanup-promoted-beta:
    name: Delete promoted STRATO queue archive (never live server)
    if: always() && inputs.destination == 'beta' && needs.promote.result == 'success' && needs.activate-beta.result == 'success'
    needs: [promote, activate-beta]
    runs-on: ubuntu-24.04
    environment: pre-beta
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned STRATO SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          mkdir -p "$RUNNER_TEMP/mkwom-ssh"
          chmod 700 "$RUNNER_TEMP/mkwom-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/mkwom-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/mkwom-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/mkwom-ssh/id_ed25519" "$RUNNER_TEMP/mkwom-ssh/known_hosts"
      - name: Delete only the activated Beta's staged pre-beta archive
        env:
          CANDIDATE: ${{ needs.promote.outputs.candidate }}
          DEPLOY_SSH_KEY_PATH: ${{ runner.temp }}/mkwom-ssh/id_ed25519
          DEPLOY_SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/mkwom-ssh/known_hosts
        run: python3 tools/cleanup_strato_candidate.py "$CANDIDATE"
  deploy-release:
    if: always() && inputs.destination == 'release' && needs.promote.result == 'success'
    needs: promote
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.promote.outputs.candidate }}
      environment: pre-beta
      restart_if_unchanged: false
    secrets: inherit
  publish-stable:
    if: always() && inputs.destination == 'release' && needs.promote.result == 'success' && needs.deploy-release.result == 'success'
    needs: [promote, deploy-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish previously approved draft (not Latest yet)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
        run: |
          set -euo pipefail
          if test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=false
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
  activate-release:
    if: always() && inputs.destination == 'release' && needs.promote.result == 'success' && needs.publish-stable.result == 'success'
    needs: [promote, publish-stable]
    uses: ./.github/workflows/channel.yml
    with:
      tag: ${{ needs.promote.outputs.tag }}
      channel: release
      source_tag: ${{ needs.promote.outputs.candidate }}
  mark-latest:
    if: always() && inputs.destination == 'release' && needs.promote.result == 'success' && needs.activate-release.result == 'success'
    needs: [promote, activate-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Mark deployed and activated stable Release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          gh release edit "$RELEASE_TAG" --latest
