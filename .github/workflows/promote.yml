name: Promote queued build to Beta or approved Beta to Release
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Optional; blank picks latest queued Beta candidate or current active Beta
        required: false
      destination:
        type: choice
        options: [beta, release]
        required: true
      release_version:
        description: Optional version (blank automatically increments latest stable patch)
        required: false
permissions:
  contents: write
concurrency:
  group: promote-${{ inputs.destination }}
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.destination }}
    outputs:
      tag: ${{ steps.promote.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate }}
          DESTINATION: ${{ inputs.destination }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 tools/promote.py
  deploy-beta:
    if: inputs.destination == 'beta'
    needs: promote
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.promote.outputs.tag }}
      environment: pre-beta
    secrets: inherit
  activate-beta:
    if: inputs.destination == 'beta'
    needs: [promote, deploy-beta]
    uses: ./.github/workflows/channel.yml
    with:
      tag: ${{ needs.promote.outputs.tag }}
      channel: beta
  deploy-release:
    if: inputs.destination == 'release'
    needs: promote
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.promote.outputs.tag }}
      environment: pre-beta
      restart_if_unchanged: true
    secrets: inherit
  activate-release:
    if: inputs.destination == 'release'
    needs: [promote, deploy-release]
    uses: ./.github/workflows/channel.yml
    with:
      tag: ${{ needs.promote.outputs.tag }}
      channel: release
  publish-release:
    if: inputs.destination == 'release'
    needs: [promote, activate-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish approved non-prerelease as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
