name: Re-activate existing Release (rollback/manual)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable vX.Y.Z tag (also use after publishing a workflow-created draft)
        required: true
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  activate:
    needs: validate
    uses: ./.github/workflows/channel.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      channel: release
