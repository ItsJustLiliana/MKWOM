name: Test STRATO SSH access (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    name: Read-only VPS SSH and service preflight
    runs-on: ubuntu-24.04
    environment: pre-beta
    steps:
      - name: Validate STRATO deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_UNIT: ${{ vars.DEPLOY_UNIT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "31.70.192.231"
          test "$DEPLOY_USER" = "mkwom"
          test "$DEPLOY_ROOT" = "/home/mkwom/projects/MKWOM-server"
          test "$DEPLOY_UNIT" = "mkw-lobby.service"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          mkdir -p "$RUNNER_TEMP/mkwom-ssh"
          chmod 700 "$RUNNER_TEMP/mkwom-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/mkwom-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/mkwom-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/mkwom-ssh/id_ed25519" "$RUNNER_TEMP/mkwom-ssh/known_hosts"
      - name: Verify STRATO service remotely (read-only)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/mkwom-ssh/known_hosts" \
            -i "$RUNNER_TEMP/mkwom-ssh/id_ed25519" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'systemctl --user is-active mkw-lobby.service && test -f /home/mkwom/projects/MKWOM-server/server/pki/ca.der && test -x /home/mkwom/projects/MKWOM-server/build/server/mkw-server && sha256sum /home/mkwom/projects/MKWOM-server/build/server/mkw-server'
          echo "Read-only STRATO SSH preflight passed. No service updated."
